name: Build Mac, Windows and Linux App

on:
  release:
    types: [published]
  workflow_dispatch: # Ermöglicht den manuellen Start im Browser oder per CLI
    inputs:
      platform:
        description: "Welche Plattform bauen?"
        type: choice
        default: both
        options: [both, mac, windows, linux]
      tag:
        description: "Release-Tag, an das die Artefakte gehaengt werden (z. B. v0.9.11)"
        type: string
        required: true

permissions:
  contents: write # Erlaubt das Hochladen der fertigen Dateien in das Release

# Actions auf der Node-24-Runtime (checkout v5, setup-python v6,
# action-gh-release v3). Die Vorgaengerversionen liefen auf Node 20, das
# abgekuendigt ist und vom Runner ersatzweise auf Node 24 ausgefuehrt wurde
# ("Node.js 20 is deprecated"-Warnung).

jobs:
  # Vorstufe: Syntaxpruefung und Offscreen-Testsuite. Faengt unter anderem
  # verlorene Modul-Importe ab (der Fehler, der 0.9.x den Login gekostet hat) -
  # ein PyInstaller-Build wuerde so etwas nicht bemerken.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system libraries for PyQt5
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile cammello/*.py Cammello.py

      - name: Offscreen test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python test_imports.py
          python test_098.py
          python test_uploadsel.py
          python test_cancel.py

  build-mac:
    needs: test
    if: ${{ github.event_name == 'release' || inputs.platform == 'both' || inputs.platform == 'mac' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build App
        run: |
          # --onedir statt --onefile: onefile+windowed ist auf macOS
          # deprecated (ab PyInstaller 7.0 ein Fehler); das .app-Bundle
          # entsteht bei --onedir genauso und wird gezippt.
          pyinstaller --onedir --windowed --name Cammello \
            --collect-submodules cammello Cammello.py
          cd dist
          zip -r Cammello_Mac.zip Cammello.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Cammello_Mac.zip
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: test
    if: ${{ github.event_name == 'release' || inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build App
        run: |
          # Unter Windows ist --onefile unproblematisch und ergibt eine
          # einzelne Cammello.exe.
          pyinstaller --onefile --windowed --name Cammello --collect-submodules cammello Cammello.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Cammello.exe
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: test
    if: ${{ github.event_name == 'release' || inputs.platform == 'both' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system libraries for PyQt5
        run: |
          # PyQt5 braucht zur Laufzeit ein paar X11/GL-Systembibliotheken;
          # ohne die scheitert der Start mit "could not load Qt platform
          # plugin xcb", auch wenn PyInstaller sauber gebaut hat.
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build App
        run: |
          # --onefile ergibt ein einzelnes ausfuehrbares Binary; PyQt5 ist
          # darin enthalten, der Nutzer braucht es nicht separat zu installieren.
          pyinstaller --onefile --windowed --name Cammello --collect-submodules cammello Cammello.py
          cd dist
          tar -czf Cammello_Linux.tar.gz Cammello

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Cammello_Linux.tar.gz
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
