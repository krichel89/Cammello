name: Build Mac App

on:
  release:
    types: [published]
  workflow_dispatch: # Ermöglicht den manuellen Start im Browser oder per PowerShell

permissions:
  contents: write # Erlaubt das Hochladen der fertigen Datei in das Release

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build App
        run: |
          # --onedir statt --onefile: onefile+windowed ist auf macOS
          # deprecated (ab PyInstaller 7.0 ein Fehler); das .app-Bundle
          # entsteht bei --onedir genauso und wird gezippt.
          # --collect-submodules stellt sicher, dass das cammello/-Paket
          # vollstaendig eingesammelt wird.
          pyinstaller --onedir --windowed --name Cammello \
            --collect-submodules cammello Cammello.py
          cd dist
          zip -r Cammello_Mac.zip Cammello.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cammello_Mac.zip
          # Verwendet das aktuelle Release-Tag oder faellt bei manuellem
          # Start auf das angegebene Tag zurueck.
          tag_name: ${{ github.event.release.tag_name || 'v0.9.6' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
