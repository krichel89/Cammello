name: Build macOS App

on:
  push:
    tags:
      - 'v*' # Startet den Build, wenn du ein Tag wie v1.0.0 pushst

jobs:
  build:
    runs-on: macos-latest # Nutzt einen macOS-Server von GitHub

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Deine Python-Version

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: App mit PyInstaller bauen
      run: |
        # Ersetze main.py und MeineMacApp mit deinen Werten
        pyinstaller --noconfirm --onedir --windowed --name="MeineMacApp" main.py

    - name: App in ein ZIP-Archiv packen
      run: |
        cd dist
        zip -r ../MeineMacApp-macOS.zip MeineMacApp.app

    - name: Release auf GitHub erstellen
      uses: softprops/action-gh-release@v2
      with:
        files: MeineMacApp-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}