name: Build executables

on:
  push:
    tags: ['v*']        # build + attach to release on a version tag
  workflow_dispatch:    # allow manual runs (downloadable as workflow artifacts)

permissions:
  contents: write       # required for attaching files to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Cammello-windows.zip
          - os: macos-latest
            artifact: Cammello-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name Cammello Cammello.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Cammello.exe -DestinationPath Cammello-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Cammello.app" "Cammello-macos.zip"

      # Always available for download from the Actions run (also on manual runs).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      # On a version tag, also attach the file to the GitHub release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
